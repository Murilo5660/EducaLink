<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educalink</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            background-color: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #4A90E2;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
        }

        .btn-aluno {
            background-color: #4A90E2;
            color: white;
        }

        .btn-professor {
            background-color: white;
            color: #4A90E2;
            border: 2px solid #4A90E2;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-aluno:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo">EL</div>
        <h1>Seja bem-vindo ao Educalink</h1>
        <p>Para começar, selecione seu perfil:</p>
        
        <div class="options">
            <button class="btn btn-aluno">Sou Aluno</button>
            <button class="btn btn-professor">Sou Professor</button>
        </div>
    </div>

</body>
</html>
